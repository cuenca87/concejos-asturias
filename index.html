<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1565C0">
<title>¿Dónde está? — Concejos de Asturias</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --verde: #2e7d32;
    --rojo: #c62828;
    --naranja: #ef6c00;
    --azul: #1565c0;
    --fondo: #f4f1ea;
    --texto: #2b2b2b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    overscroll-behavior: none;
  }

  /* ---------- Pantalla de inicio ---------- */
  #start-screen, #end-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    padding: 24px;
  }
  #start-screen h1, #end-screen h1 {
    font-size: 2.1em;
    margin-bottom: 0.2em;
    color: var(--azul);
  }
  #start-screen p, #end-screen p {
    font-size: 1.25em;
    max-width: 480px;
    line-height: 1.5;
  }
  .btn-grande {
    margin-top: 28px;
    font-size: 1.5em;
    padding: 18px 48px;
    border: none;
    border-radius: 14px;
    background: var(--verde);
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    transition: transform 0.1s;
  }
  .btn-grande:active { transform: scale(0.96); }
  #best-score {
    margin-top: 18px;
    font-size: 1.1em;
    color: var(--azul);
    font-weight: bold;
  }

  /* ---------- Pantalla de juego ---------- */
  #game-screen { display: none; height: 100%; flex-direction: column; }
  #topbar {
    background: var(--azul);
    color: white;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 1.05em;
    z-index: 500;
  }
  #topbar .progreso { font-weight: bold; }
  #topbar .puntuacion { font-weight: bold; }
  #intentos { display: flex; gap: 6px; }
  #btn-rendirse {
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 0.9em;
    cursor: pointer;
  }
  #btn-rendirse:active { background: rgba(255,255,255,0.3); }
  .vida {
    width: 18px; height: 18px; border-radius: 50%;
    background: white;
    display: inline-block;
  }
  .vida.usada { background: rgba(255,255,255,0.25); }

  #pregunta {
    background: white;
    text-align: center;
    padding: 12px 16px 8px;
    font-size: 1.3em;
    font-weight: bold;
  }
  #pregunta span { color: var(--verde); }

  #mensaje {
    text-align: center;
    padding: 6px 12px;
    font-size: 1.15em;
    font-weight: bold;
    min-height: 1.6em;
    background: white;
  }
  #mensaje.acierto { color: var(--verde); }
  #mensaje.fallo { color: var(--rojo); }
  #mensaje.revelado { color: var(--naranja); }

  #map { flex: 1; }

  /* ---------- Pantalla final ---------- */
  #end-screen { display: none; }
  #resumen-lista {
    max-width: 520px;
    max-height: 40vh;
    overflow-y: auto;
    text-align: left;
    margin-top: 16px;
    border-top: 1px solid #ccc;
    font-size: 0.95em;
  }
  .fila-resumen {
    display: flex;
    justify-content: space-between;
    padding: 4px 8px;
    border-bottom: 1px solid #e2ddd0;
  }
  .fila-resumen.fallado { color: var(--rojo); }
  .fila-resumen.perfecto { color: var(--verde); }
  .fila-resumen.rendido { color: var(--naranja); }

  .leaflet-container { background: #cfe8f3; font-family: inherit; }
  .etiqueta-capital {
    background: rgba(255,255,255,0.95);
    border: none;
    border-left: 4px solid #999;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    font-weight: normal;
    font-style: italic;
    font-size: 0.8em;
    padding: 2px 7px 2px 5px;
    color: #2b2b2b;
    border-radius: 0 4px 4px 0;
  }
  .etiqueta-capital::before { display: none; }
  .etiqueta-capital-acierto { border-left-color: var(--verde); }
  .etiqueta-capital-fallo { border-left-color: var(--rojo); }
  .etiqueta-capital-rendido { border-left-color: var(--naranja); }
  .etiqueta-concejo {
    border: none;
    box-shadow: 0 1px 5px rgba(0,0,0,0.5);
    font-weight: bold;
    font-size: 1em;
    padding: 3px 9px;
    border-radius: 4px;
    color: white;
  }
  .etiqueta-concejo::before { display: none; }
  .etiqueta-concejo-acierto { background: rgba(27,94,32,0.9); }
  .etiqueta-concejo-fallo { background: rgba(142,0,0,0.9); }
  .etiqueta-concejo-rendido { background: rgba(201,138,0,0.9); }
</style>
</head>
<body>

<div id="start-screen">
  <h1>¿Dónde está?</h1>
  <p>Un juego para aprender los 78 concejos de Asturias.<br>
  Te iremos diciendo un nombre y tienes que señalarlo en el mapa.<br>
  Tienes <strong>3 intentos</strong> por concejo: cuanto antes aciertes, más puntos consigues.</p>
  <div id="best-score"></div>
  <button class="btn-grande" id="btn-empezar">Empezar a jugar</button>
</div>

<div id="game-screen">
  <div id="topbar">
    <div class="progreso" id="progreso">Concejo 1 / 78</div>
    <div id="intentos"></div>
    <div class="puntuacion" id="puntuacion">Puntos: 0</div>
    <button id="btn-rendirse">Rendirse</button>
  </div>
  <div id="pregunta">Busca: <span id="nombre-actual">—</span></div>
  <div id="mensaje"></div>
  <div id="map"></div>
</div>

<div id="end-screen">
  <h1>¡Partida terminada!</h1>
  <p id="resultado-final"></p>
  <div id="resumen-lista"></div>
  <button class="btn-grande" id="btn-reiniciar">Jugar otra vez</button>
</div>

  const PUNTOS_POR_INTENTO = [3, 2, 1]; // índice 0 = primer intento, etc.
  const TOTAL_INTENTOS = 3;
  const LS_KEY = "asturias-concejos-mejor-puntuacion";

  const startScreen = document.getElementById("start-screen");
  const gameScreen = document.getElementById("game-screen");
  const endScreen = document.getElementById("end-screen");
  const btnEmpezar = document.getElementById("btn-empezar");
  const btnRendirse = document.getElementById("btn-rendirse");
  const btnReiniciar = document.getElementById("btn-reiniciar");
  const nombreActualEl = document.getElementById("nombre-actual");
  const mensajeEl = document.getElementById("mensaje");
  const progresoEl = document.getElementById("progreso");
  const puntuacionEl = document.getElementById("puntuacion");
  const intentosEl = document.getElementById("intentos");
  const bestScoreEl = document.getElementById("best-score");
  const resultadoFinalEl = document.getElementById("resultado-final");
  const resumenListaEl = document.getElementById("resumen-lista");

  let map, geoLayer, marcadoresCapitales;
  const layersByName = {};

  let orden = [];
  let idx = 0;
  let intentosRestantes = TOTAL_INTENTOS;
  let puntuacion = 0;
  let respondido = false; // true mientras se muestra feedback y se espera "siguiente"
  let resultados = []; // {nombre, puntos, intento}

  const estiloBase = { color: "#ffeb3b", weight: 1.5, fillColor: "#ffeb3b", fillOpacity: 0.08 };
  const estiloAcierto = { color: "#1b5e20", weight: 2, fillColor: "#4caf50", fillOpacity: 0.75 };
  const estiloFallo = { color: "#8e0000", weight: 2, fillColor: "#e53935", fillOpacity: 0.75 };
  const estiloRendido = { color: "#c98a00", weight: 2, fillColor: "#ffeb3b", fillOpacity: 0.75 };
  const COLOR_ESTADO = { acierto: "#1b5e20", fallo: "#8e0000", rendido: "#c98a00" };
  const estadoConcejos = {}; // nombre -> "acierto" | "fallo" | "rendido", se conserva pintado durante toda la partida

  function estiloPersistido(nombre) {
    if (estadoConcejos[nombre] === "acierto") return estiloAcierto;
    if (estadoConcejos[nombre] === "fallo") return estiloFallo;
    if (estadoConcejos[nombre] === "rendido") return estiloRendido;
    return estiloBase;
  }

  function mostrarMejorPuntuacion() {
    const mejor = localStorage.getItem(LS_KEY);
    bestScoreEl.textContent = mejor ? "Mejor puntuación: " + mejor + " / " + (78 * 3) : "";
  }

  function barajar(array) {
    const a = array.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function initMap(geojson) {
    map = L.map("map", { zoomControl: true, scrollWheelZoom: true });
    L.tileLayer(
      "https://www.ign.es/wmts/pnoa-ma?service=WMTS&request=GetTile&version=1.0.0&layer=OI.OrthoimageCoverage&style=default&format=image/jpeg&tilematrixset=GoogleMapsCompatible&tilematrix={z}&tilerow={y}&tilecol={x}",
      { maxZoom: 19, attribution: "PNOA - IGN España" }
    ).addTo(map);
    geoLayer = L.geoJSON(geojson, {
      style: estiloBase,
      onEachFeature: function (feature, layer) {
        const nombre = feature.properties.nombre;
        layersByName[nombre] = layer;
        layer.on("click", function () { onClickConcejo(nombre, layer); });
      }
    }).addTo(map);
    marcadoresCapitales = L.layerGroup().addTo(map);
  }

  function mostrarCapital(nombreConcejo, estado) {
    const info = CAPITALES_CONCEJOS[nombreConcejo];
    if (!info) return;
    L.circleMarker([info.lat, info.lon], {
      radius: 5, color: "#222", weight: 1.5, fillColor: COLOR_ESTADO[estado], fillOpacity: 1
    })
      .bindTooltip("📍 " + info.capital, { permanent: true, direction: "top", offset: [0, -6], className: "etiqueta-capital etiqueta-capital-" + estado })
      .addTo(marcadoresCapitales)
      .openTooltip();
  }

  function mostrarNombreConcejo(nombreConcejo, estado) {
    const layer = layersByName[nombreConcejo];
    if (!layer) return;
    layer
      .bindTooltip(nombreConcejo, { permanent: true, direction: "center", className: "etiqueta-concejo etiqueta-concejo-" + estado })
      .openTooltip();
  }

  function actualizarIntentosUI() {
    intentosEl.innerHTML = "";
    for (let i = 0; i < TOTAL_INTENTOS; i++) {
      const v = document.createElement("span");
      v.className = "vida" + (i < intentosRestantes ? "" : " usada");
      intentosEl.appendChild(v);
    }
  }

  function iniciarRonda() {
    respondido = false;
    intentosRestantes = TOTAL_INTENTOS;
    const nombre = orden[idx];
    nombreActualEl.textContent = nombre;
    progresoEl.textContent = "Concejo " + (idx + 1) + " / " + orden.length;
    puntuacionEl.textContent = "Puntos: " + puntuacion;
    mensajeEl.textContent = "";
    mensajeEl.className = "";
    actualizarIntentosUI();
  }

  function onClickConcejo(nombre, layer) {
    if (respondido) return;
    const actual = orden[idx];

    if (nombre === actual) {
      const puntos = PUNTOS_POR_INTENTO[TOTAL_INTENTOS - intentosRestantes];
      puntuacion += puntos;
      estadoConcejos[actual] = "acierto";
      layer.setStyle(estiloAcierto);
      mostrarCapital(actual, "acierto");
      mostrarNombreConcejo(actual, "acierto");
      mensajeEl.textContent = "¡Correcto! +" + puntos + " puntos";
      mensajeEl.className = "acierto";
      puntuacionEl.textContent = "Puntos: " + puntuacion;
      resultados.push({ nombre: actual, puntos: puntos, acierto: true });
      terminarRonda(1100);
    } else {
      intentosRestantes--;
      actualizarIntentosUI();
      layer.setStyle(estiloFallo);
      setTimeout(function () {
        if (layer.options.fillColor === estiloFallo.fillColor) layer.setStyle(estiloPersistido(nombre));
      }, 450);

      if (intentosRestantes <= 0) {
        mensajeEl.textContent = "Sin más intentos. Era: " + actual;
        mensajeEl.className = "revelado";
        estadoConcejos[actual] = "fallo";
        const layerCorrecto = layersByName[actual];
        if (layerCorrecto) layerCorrecto.setStyle(estiloFallo);
        mostrarCapital(actual, "fallo");
        mostrarNombreConcejo(actual, "fallo");
        resultados.push({ nombre: actual, puntos: 0, acierto: false });
        terminarRonda(1700);
      } else {
        mensajeEl.textContent = "No es ahí. Te queda" + (intentosRestantes === 1 ? "" : "n") + " " + intentosRestantes + " intento" + (intentosRestantes === 1 ? "" : "s");
        mensajeEl.className = "fallo";
      }
    }
  }

  let temporizadorRonda = null;

  function terminarRonda(delayMs) {
    respondido = true;
    temporizadorRonda = setTimeout(siguienteRonda, delayMs);
  }

  function siguienteRonda() {
    idx++;
    if (idx >= orden.length) {
      finalizarJuego();
    } else {
      iniciarRonda();
    }
  }

  let juegoRendido = false;

  function rendirse() {
    if (!confirm("¿Seguro que quieres rendirte? Se mostrarán en el mapa todos los concejos que faltan.")) return;
    clearTimeout(temporizadorRonda);
    respondido = true;
    juegoRendido = true;

    orden.forEach(function (nombre) {
      if (estadoConcejos[nombre]) return; // ya resuelto (acierto o fallo)
      estadoConcejos[nombre] = "rendido";
      const layer = layersByName[nombre];
      if (layer) layer.setStyle(estiloRendido);
      mostrarCapital(nombre, "rendido");
      mostrarNombreConcejo(nombre, "rendido");
      resultados.push({ nombre: nombre, puntos: 0, acierto: false, rendido: true });
    });

    nombreActualEl.textContent = "—";
    mensajeEl.textContent = "Aquí tienes todos los concejos. Revisa el mapa y pulsa el botón cuando quieras ver tu puntuación.";
    mensajeEl.className = "revelado";
    btnRendirse.textContent = "Ver resultado final";
  }

  function onClickBtnRendirse() {
    if (juegoRendido) {
      finalizarJuego();
    } else {
      rendirse();
    }
  }

  function finalizarJuego() {
    gameScreen.style.display = "none";
    endScreen.style.display = "flex";
    const maxPosible = orden.length * 3;
    resultadoFinalEl.textContent = "Puntuación: " + puntuacion + " / " + maxPosible;

    const mejorAnterior = parseInt(localStorage.getItem(LS_KEY) || "0", 10);
    if (puntuacion > mejorAnterior) {
      localStorage.setItem(LS_KEY, String(puntuacion));
      resultadoFinalEl.textContent += "  ¡Nueva mejor puntuación!";
    }

    resumenListaEl.innerHTML = "";
    resultados
      .slice()
      .sort(function (a, b) { return a.puntos - b.puntos; })
      .forEach(function (r) {
        const fila = document.createElement("div");
        const etiqueta = r.acierto ? "+" + r.puntos : (r.rendido ? "sin jugar" : "fallado");
        fila.className = "fila-resumen " + (r.acierto ? (r.puntos === 3 ? "perfecto" : "") : (r.rendido ? "rendido" : "fallado"));
        fila.innerHTML = "<span>" + r.nombre + "</span><span>" + etiqueta + "</span>";
        resumenListaEl.appendChild(fila);
      });
  }

  function empezarPartida() {
    idx = 0;
    puntuacion = 0;
    resultados = [];
    orden = barajar(Object.keys(layersByName));
    for (const nombre in estadoConcejos) delete estadoConcejos[nombre];
    geoLayer.eachLayer(function (l) { l.setStyle(estiloBase); l.unbindTooltip(); });
    marcadoresCapitales.clearLayers();
    juegoRendido = false;
    btnRendirse.textContent = "Rendirse";
    startScreen.style.display = "none";
    endScreen.style.display = "none";
    gameScreen.style.display = "flex";
    setTimeout(function () {
      map.invalidateSize();
      map.fitBounds(geoLayer.getBounds(), { padding: [10, 10] });
    }, 50);
    iniciarRonda();
  }

  btnEmpezar.addEventListener("click", empezarPartida);
  btnRendirse.addEventListener("click", onClickBtnRendirse);
  btnReiniciar.addEventListener("click", function () {
    endScreen.style.display = "none";
    startScreen.style.display = "flex";
    mostrarMejorPuntuacion();
  });

  mostrarMejorPuntuacion();

  initMap(CONCEJOS_GEOJSON);
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
